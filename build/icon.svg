<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深褐暖调底 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3A2C"/>
      <stop offset="1" stop-color="#2B211A"/>
    </linearGradient>
    <!-- 山体暖棕 -->
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4A574"/>
      <stop offset="1" stop-color="#B07E4E"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5A3C"/>
      <stop offset="1" stop-color="#6E4429"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板（macOS squircle 视觉比例，内容留边） -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="none" stroke="#D4A574" stroke-opacity="0.18" stroke-width="6"/>

  <!-- 相册纸页堆叠 -->
  <g transform="rotate(-7 512 560)">
    <rect x="306" y="360" width="412" height="360" rx="26" fill="#EAD9C0" opacity="0.5"/>
  </g>
  <g transform="rotate(4 512 560)">
    <rect x="308" y="340" width="408" height="380" rx="26" fill="#F5EDE2" opacity="0.85"/>
  </g>

  <!-- 主照片：山与日出 -->
  <g transform="rotate(-2 512 552)">
    <rect x="288" y="308" width="448" height="436" rx="30" fill="#FAF8F5"/>
    <rect x="314" y="334" width="396" height="336" rx="18" fill="#F6EBDD"/>
    <!-- 太阳 -->
    <circle cx="612" cy="446" r="50" fill="#E8B571"/>
    <!-- 远山 -->
    <path d="M314 626 L446 448 L528 552 L596 470 L710 626 Z" fill="url(#m2)" opacity="0.9"/>
    <!-- 近山 -->
    <path d="M314 670 L420 520 L506 626 L580 540 L710 670 Z" fill="url(#m1)"/>
  </g>
</svg>
