name: Release

# 推送 v* 标签时：macOS / Windows 矩阵构建安装包，汇总创建 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --publish never
          - os: windows-latest
            args: --win --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer & main
        run: npx electron-vite build

      - name: Package (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.args }}
        env:
          # 未签名构建：跳过 macOS 证书探测
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes/v0.9.md
          files: |
            dist/*.dmg
            dist/*.exe
            docs/screenshots/*.png
          fail_on_unmatched_files: true
